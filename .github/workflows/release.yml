name: Release

# 打一个 v1.2.0 这样的 tag 就会自动编译、跑测试、打包并发布 Release。
# 也可以在 Actions 页面手动运行并指定版本号。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.2.0，不带 v）。留空则用 1.0.<运行序号>'
        required: false
        default: ''

permissions:
  contents: write

run-name: 打包发布 ${{ github.ref_name }}

jobs:
  release:
    name: 打包并发布
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}".Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif ($raw) {
            $version = $raw.TrimStart('v')
          } else {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "版本号格式不对：$version（应形如 1.2.0）"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "本次版本：$version"

      - name: 还原依赖
        run: dotnet restore vpn-reconnect.sln

      - name: 编译
        run: dotnet build vpn-reconnect.sln -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: 单元测试
        run: dotnet test vpn-reconnect.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: 发布单文件 exe（自包含 win-x64）
        shell: pwsh
        run: |
          dotnet publish src/VpnReconnect.App/VpnReconnect.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:InformationalVersion=${{ steps.ver.outputs.version }} `
            -o publish

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = 'publish/VpnReconnect.exe'
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          $info = (Get-Item $exe).VersionInfo
          Write-Host "VpnReconnect.exe 大小 $size MB，文件版本 $($info.FileVersion)，产品版本 $($info.ProductVersion)"
          if (-not $info.FileVersion) {
            Write-Warning '产物没有版本资源，请检查 csproj 的 Version 设置'
          }

      - name: 打包 zip 与校验和
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $name = "VpnReconnect-$version-win-x64"
          Compress-Archive -Path 'publish/VpnReconnect.exe', 'README.md' -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "$name.zip.sha256" -Encoding utf8NoBOM
          Write-Host "$name.zip $([math]::Round((Get-Item "$name.zip").Length / 1MB, 1)) MB"
          Get-ChildItem "$name.*" | Select-Object Name, Length

      - name: 写发布说明
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $previous = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1)
          $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
          $commits = (git log $range --no-merges --pretty=format:'- %s (%h)') -join "`n"

          $lines = @(
            'Windows 免安装单文件版，自包含 .NET 8 运行时，双击 `VpnReconnect.exe` 即可运行。',
            '',
            '### 首次使用',
            '',
            '1. 打开程序，在「设置」→「VPN 连接」里选中**正在连着的公司适配器**（如「公司 192.168.4.28」）。',
            '2. 填用户名、密码，可选填目标地址（如 `192.168.4.100`），点「保存」。',
            '3. 关掉窗口程序不会退出，会缩到托盘继续按间隔检查、断线自动重连。',
            '',
            '### 本次改动',
            '',
            $commits,
            '',
            '完整校验和见 `VpnReconnect-${{ steps.ver.outputs.version }}-win-x64.zip.sha256`。'
          )
          $lines -join "`n" | Out-File -FilePath 'release-notes.md' -Encoding utf8NoBOM
          Get-Content 'release-notes.md'

      - name: 发布到 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          $name = "VpnReconnect-$version-win-x64"
          $assets = @("$name.zip", "$name.zip.sha256", 'publish/VpnReconnect.exe')

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            gh release create $tag --title "v$version" --notes-file 'release-notes.md' @assets
          } else {
            gh release create $tag --target $env:GITHUB_SHA --title "v$version" --notes-file 'release-notes.md' @assets
          }

      - name: 上传构建产物（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VpnReconnect-${{ steps.ver.outputs.version }}
          path: |
            publish/VpnReconnect.exe
            VpnReconnect-${{ steps.ver.outputs.version }}-win-x64.zip
            release-notes.md
            **/TestResults/*.trx
          if-no-files-found: ignore
